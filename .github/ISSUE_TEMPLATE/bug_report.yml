name: Bug report
description: Report a reproducible problem in Playstead.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "This is public. Do not include passwords, tokens, private files, IP addresses, player names, or sensitive security details. Original console logs are not anonymized."
  - type: input
    id: version
    attributes:
      label: Playstead version
      description: Copy the version shown in Settings. Do not include a personal download URL.
      placeholder: 0.1.0-beta.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Version or build only. No computer name, account name, email, or device identifier.
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Affected area
      options:
        - Minecraft
        - Terraria
        - tModLoader
        - App or installer
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result
      description: Explain what you clicked, what happened, and what you expected. Replace any private names or addresses.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Optional reviewed diagnostic report
      description: Only paste the report prepared in Settings → Support and diagnostics after checking its preview. Do not paste raw console logs or configuration files.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I understand this issue is public and have checked it contains no credentials or private data.
          required: true
